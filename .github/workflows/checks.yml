name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m json.tool catalog/releases.json >/dev/null
      - run: python -m json.tool catalog/models.json >/dev/null
      - run: python -m pytest
      - run: python -m ruff check silencio_onnx_bundles scripts tests
